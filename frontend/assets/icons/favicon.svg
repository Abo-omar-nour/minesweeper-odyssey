<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060b16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tileLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="tileDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="16"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="28 20" opacity="0.35"/>
  <!-- Top-Left Tile: 1 -->
  <rect x="68" y="68" width="164" height="164" rx="36" fill="url(#tileLight)" stroke="#38bdf8" stroke-width="8"/>
  <text x="150" y="184" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="108" fill="#2563eb">1</text>
  <!-- Top-Right Tile: Golden Star -->
  <rect x="280" y="68" width="164" height="164" rx="36" fill="url(#tileDark)" stroke="#f59e0b" stroke-width="10"/>
  <polygon points="362,96 377,130 414,135 386,160 394,196 362,177 330,196 338,160 310,135 347,130" fill="url(#goldGrad)"/>
  <!-- Bottom-Left Tile: Red Pennant Flag -->
  <rect x="68" y="280" width="164" height="164" rx="36" fill="url(#tileDark)" stroke="#38bdf8" stroke-width="8"/>
  <rect x="122" y="314" width="12" height="96" rx="6" fill="#fef08a"/>
  <polygon points="134,316 204,344 134,374" fill="#ef4444"/>
  <!-- Bottom-Right Tile: 2 -->
  <rect x="280" y="280" width="164" height="164" rx="36" fill="url(#tileLight)" stroke="#38bdf8" stroke-width="8"/>
  <text x="362" y="396" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="108" fill="#16a34a">2</text>
  <!-- Center 3D Naval Mine Emblem -->
  <circle cx="256" cy="256" r="110" fill="#090d16" opacity="0.9"/>
  <g stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round">
    <line x1="256" y1="124" x2="256" y2="388"/>
    <line x1="124" y1="256" x2="388" y2="256"/>
    <line x1="162" y1="162" x2="350" y2="350"/>
    <line x1="350" y1="162" x2="162" y2="350"/>
  </g>
  <circle cx="256" cy="256" r="78" fill="#111827" stroke="#38bdf8" stroke-width="14"/>
  <circle cx="232" cy="232" r="22" fill="#ffffff" opacity="0.92"/>
  <circle cx="278" cy="278" r="15" fill="#38bdf8"/>
</svg>